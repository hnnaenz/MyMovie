<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MyMovie - Discover Movies</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🎥 MyMovie˙✧˖°</h1>
 
<nav>
    <a href="index.html" class="active">
        Discover Movies
    </a>
    <a href="watchlist.html">
        My Watchlist
    </a>
</nav>

    </header>

    <main>
        <h2>🍿Discover Movies🍿</h2>
        <p>Find your next favourite movie!</p>

        <div class="search-box">
            <input
                type="text"
                id="movieSearch"
                placeholder="Enter movie title"
            >

            <button id="searchBtn">Search</button>
        </div>

<section class="recommend-section">
    <h2>Movie Recommendations</h2>
    <p>Select your preferred genre</p>

    <select id="genreSelect">
        <option value="">-- Select Genre --</option>
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Horror">Horror</option>
        <option value="Romance">Romance</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Animation">Animation</option>
    </select>

    <button id="recommendBtn">
        Get Recommendations
    </button>

    <div id="recommendResults"></div>
</section>

        <h2>Search Results</h2>

        <div id="movieResults">
            <p>Search for a movie to get started.</p>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
